# Catálogo de fuentes de datos — Proyecto Sisbén IV / Inferencia causal
#
# Este archivo documenta trazabilidad, tipo de acceso y estado de gestión
# de cada fuente usada para la contrastación (GEIH, Sisbén IV, DPS, IPM,
# RUI), siguiendo el mismo patrón de catálogo empleado en el proyecto
# hermano `desarrollo_social_y_economico` (data/catalogo.yaml).
#
# Estado: pendiente | en_gestion | disponible
# Acceso: abierto | registro | solicitud_institucional

fuentes:

  - id: geih
    nombre: "Gran Encuesta Integrada de Hogares"
    entidad: DANE
    portal: "microdatos.dane.gov.co"
    catalogo_ref: null  # completar con número de catálogo tras registro
    periodo: "2024-2025 (anual)"
    unidad_analisis: hogar / persona
    acceso: registro
    estado: pendiente
    notas: >
      Microdatos anonimizados disponibles previo registro en el Archivo
      Nacional de Datos (ANDA) del DANE. Fuente primaria para pobreza
      monetaria y multidimensional; ~315.000 hogares/año.
    variables_clave:
      - ingreso_percapita
      - condicion_ocupacion
      - informalidad_laboral
      - composicion_hogar

  - id: sisben_iv
    nombre: "Sisbén IV — Registro Social de Hogares"
    entidad: DNP
    portal: "sisben.gov.co (solicitud académica ante DNP)"
    catalogo_ref: null
    periodo: "2020-2026 (registro continuo)"
    unidad_analisis: hogar
    acceso: solicitud_institucional
    estado: pendiente
    notas: >
      Microdato para investigación académica solicitado directamente al
      DNP. Variable de tratamiento del estudio: puntaje continuo (0-100)
      y grupo de elegibilidad (A/B/C/D).
    variables_clave:
      - puntaje_sisben
      - grupo_elegibilidad
      - zona
      - departamento

  - id: dps
    nombre: "Registros de programas de transferencias (DPS)"
    entidad: "Departamento para la Prosperidad Social"
    portal: "prosperidadsocial.gov.co"
    catalogo_ref: null
    periodo: "2023 (según disponibilidad)"
    unidad_analisis: hogar / persona
    acceso: solicitud_institucional
    estado: pendiente
    notas: >
      Beneficiarios de Familias en Acción, Jóvenes en Acción, Colombia
      Mayor e Ingreso Solidario. Permite vincular elegibilidad formal
      con participación real en programas.
    variables_clave:
      - beneficiario_familias_accion
      - beneficiario_ingreso_solidario

  - id: ipm
    nombre: "Índice de Pobreza Multidimensional"
    entidad: DANE
    portal: "microdatos.dane.gov.co (descarga manual, registro requerido)"
    catalogo_ref: null  # el dataset de datos.gov.co (ntk3-fdqa) NO tiene API tabular habilitada (error Socrata: "no row or column access to non-tabular tables"); descartado.
    catalogo_ref_por_anio: {}
    periodo: "2024-2025"
    unidad_analisis: hogar (indicadores agregados también disponibles)
    acceso: registro
    estado: disponible
    notas: >
      Verificado 2026-08-04: descarga manual desde
      microdatos.dane.gov.co/index.php/catalog/903, previo registro
      gratuito. Trae 6 archivos (Hogares/Personas/Viviendas x
      Nacional/Departamental), depositados en
      data/0_raw/ipm/{nacional,departamental}/{hogares,personas,viviendas}.csv.
      Procesados por src/1_integracion.py vía ARCHIVOS_LOCALES.
      Hogares nacional: 79.125 filas, tasa de pobreza (POBRE=1): ~13.0%,
      IPM promedio 0.195 (rango 0.0-0.86).
    diccionario_variables:
      # Nombres técnicos reales, extraídos del DDI XML oficial
      # (DANE-DIMPE-POBREZA-MULTIDIMENSIONAL-2025.xml, 146 variables).
      # NOTA: el DDI describe VARIAS bases relacionadas (hogar/persona,
      # nacional/departamental) bajo el mismo <dataDscr>; hay nombres
      # repetidos con mayúscula distinta (ej. IPM vs ipm, FEX_C vs fex_c)
      # porque corresponden a archivos de datos diferentes dentro del
      # mismo estudio — confirmar el nombre exacto por archivo cuando se
      # descargue la base real (no solo la ficha DDI).
      identificadores:
        DIRECTORIO: "Identificador de hogar"
        SECUENCIA_ENCUESTA: "Secuencia de la encuesta"
        SECUENCIA_P: "Secuencia de persona"
        FEX_C: "Factor de expansión (hogar)"
        FEXP: "Factor de expansión (personas)"
      privaciones_15:
        logro_educativo: "Privación por bajo logro educativo"
        analfabetismo: "Privación por analfabetismo"
        inasistencia_escolar: "Privación por inasistencia escolar"
        rezago_escolar: "Privación por rezago escolar"
        atencion_integral: "Privación por barreras de acceso a atención integral primera infancia"
        trabajo_infantil: "Privación por trabajo infantil"
        desempleo_larga_duracion: "Privación por desempleo de larga duración"
        empleo_formal: "Privación por tasa de empleo formal (informalidad)"
        aseguramiento_salud: "Privación por no aseguramiento en salud"
        barreras_acceso_salud: "Privación por barreras de acceso a salud"
        acueducto: "Privación por no acceso a fuente de agua mejorada"
        alcantarillado: "Privación por inadecuada eliminación de excretas"
        pisos: "Privación por material inadecuado de pisos"
        paredes: "Privación por material inadecuado de paredes exteriores"
        hacinamiento: "Privación por hacinamiento crítico"
      resultado:
        ipm: "Índice de Pobreza Multidimensional (suma ponderada de privaciones)"
        pobre: "Hogar clasificado como pobre (IPM >= 5/15)"
    variables_clave:
      # Lista plana para uso rápido en scripts (ver diccionario_variables
      # arriba para el detalle y las notas de identificadores/factores
      # de expansión).
      - ipm
      - pobre
      - logro_educativo
      - analfabetismo
      - inasistencia_escolar
      - rezago_escolar
      - atencion_integral
      - trabajo_infantil
      - desempleo_larga_duracion
      - empleo_formal
      - aseguramiento_salud
      - barreras_acceso_salud
      - acueducto
      - alcantarillado
      - pisos
      - paredes
      - hacinamiento

  - id: rui
    nombre: "Registro Único de Víctimas"
    entidad: "Unidad para las Víctimas (UARIV)"
    portal: "unidadvictimas.gov.co"
    catalogo_ref: null
    periodo: vigente
    unidad_analisis: persona / hogar
    acceso: solicitud_institucional
    estado: pendiente
    notas: >
      Utilizado como covariable de control (condición de víctima del
      conflicto armado). Requiere convenio o solicitud institucional.
    variables_clave:
      - condicion_victima

# Estrategia de vinculación (OE4): statistical matching a nivel municipal
# usando el Registro Social de Hogares como puente de integración entre
# GEIH y Sisbén IV. Ver docs/Anteproyecto_Sisben_IV.docx, sección 4.3.
