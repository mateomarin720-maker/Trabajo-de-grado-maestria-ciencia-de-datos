[tool.poetry]
name = "sisben_causal"
version = "0.1.0"
description = "Inferencia causal sobre la clasificación en el Sisbén IV — Proyecto de grado, Maestría en Ciencia de Datos, USTA."
authors = [
    "Juan Sebastián Fonseca Arévalo <tu.email@usantotomas.edu.co>",
    "José Mateo Roncancio Marín <tu.email@usantotomas.edu.co>"
]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
# Manipulación y E/S de datos
pandas = "^2.2.0"
numpy = "^2.0.0"
pyarrow = "^16.0.0"
requests = "^2.31.0"
pyyaml = "^6.0"
python-dotenv = "^1.0.0"
#
# Modelado base
scikit-learn = ">=1.4.0,<1.6.0"
xgboost = "^2.0.0"
#
# Inferencia causal
dowhy = ">=0.11,<1.0"
econml = "^0.15"
causal-learn = "^0.1.3"
networkx = "^3.2"
#
# Visualización
matplotlib = "^3.8"
seaborn = "^0.13"
shap = ">=0.42.0,<0.44.0"
graphviz = "^0.20"
#
# Entorno exploratorio
jupyterlab = "^4.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
